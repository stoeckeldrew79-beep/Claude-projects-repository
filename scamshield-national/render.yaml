# Render Blueprint: provisions the backend API + its Postgres database in
# one step. In the Render dashboard: New + -> Blueprint -> connect this repo
# -> set "Blueprint file path" to scamshield-national/render.yaml.
#
# On every push to main, the backend's own "start" script (migrate -> seed
# -> listen) reruns automatically, so newly delivered scam/profile/guide
# content goes live on redeploy with no extra step.
services:
  - type: web
    name: scamshield-national-backend
    env: node
    rootDir: scamshield-national/backend
    plan: starter
    # --include=dev: Render sets NODE_ENV=production for the build step too,
    # which makes a plain `npm install` skip devDependencies — but the build
    # needs typescript and the @types/* packages to compile at all.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://www.scamtitan.com"

  # Scans live US/international scam news (Google News RSS, no API key)
  # and publishes headlines to the "Today's Scams" feed. Idempotent (deduped
  # by source URL) and documented as safe to run more than once a day, but
  # it only ran once a day ("0 11 * * *") until this comment: with a ~24h
  # gap between runs, the newest headline was routinely 15-23h old by the
  # time anyone looked, which reads as a dead "LIVE FEED" even though the
  # job itself was running fine every day without fail. A run takes well
  # under a minute (26 Google News RSS queries, no API key, no rate-limit
  # risk unlike the AG/federal scans below), so every 2 hours keeps the
  # feed genuinely fresh at negligible cost.
  - type: cron
    name: scamshield-scan-daily-news
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "0 */2 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run scan-daily-news
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

  # The state Attorney General feed engine: reads each office's own releases
  # directly (46 of 51 states; see backend/src/jobs/agFeedSources.ts), with
  # news search as the fallback. Every 4 hours — releases land through the
  # day, and a once-a-day scan left state pages up to a day behind. Each
  # source's health is recorded in ag_feed_status and watched by the
  # production monitor.
  - type: cron
    name: scamshield-scan-state-ag-news
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "15 */4 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run scan-state-ag-news
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

  # Scans the DOJ's and FTC's own press-release feeds and powers the
  # Federal Watch page (/federal) — the federal-level counterpart to the
  # state AG scan above.
  - type: cron
    name: scamshield-scan-federal-news
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "20 11 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run scan-federal-news
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

  # Early-warning alert detection: turns patterns in public scam reports
  # (the same scammer contact reported repeatedly, a category spiking) into
  # alert candidates in the /admin review queue. It never sends anything on
  # its own; a person approves every alert. Idempotent (tag-based dedupe),
  # so a daily run is safe. Built months ago but never scheduled anywhere,
  # so it had never run in production.
  #
  # State-targeted alerts stay off until ALERTS_STATE_DETECTION=1 is added
  # to this service's environment in the Render dashboard (see README
  # "State-targeted alerts").
  - type: cron
    name: scamshield-detect-alerts
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "30 11 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run detect-alerts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

databases:
  - name: scamshield-national-db
    plan: 0.1c-256mb
    databaseName: scamshield
    user: scamshield
