# Render Blueprint: provisions the backend API + its Postgres database in
# one step. In the Render dashboard: New + -> Blueprint -> connect this repo
# -> set "Blueprint file path" to scamshield-national/render.yaml.
#
# On every push to main, the backend's own "start" script (migrate -> seed
# -> listen) reruns automatically, so newly delivered scam/profile/guide
# content goes live on redeploy with no extra step.
services:
  - type: web
    name: scamshield-national-backend
    env: node
    rootDir: scamshield-national/backend
    plan: starter
    # --include=dev: Render sets NODE_ENV=production for the build step too,
    # which makes a plain `npm install` skip devDependencies — but the build
    # needs typescript and the @types/* packages to compile at all.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://claude-projects-repository.vercel.app"

  # Scans live US/international scam news (Google News RSS, no API key)
  # and publishes headlines to the "Today's Scams" feed. Safe to run more
  # than once a day — dedupes by source URL.
  - type: cron
    name: scamshield-scan-daily-news
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "0 11 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run scan-daily-news
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

  # Scans all 51 state Attorney General offices (first-party feed where one
  # exists, news search everywhere else) and powers the state-level AG alert
  # feed shown on each state page. Built to run right after the national
  # scan above (see README) but never wired into a schedule here — this is
  # that missing wiring.
  - type: cron
    name: scamshield-scan-state-ag-news
    runtime: node
    rootDir: scamshield-national/backend
    schedule: "15 11 * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run scan-state-ag-news
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-national-db
          property: connectionString

databases:
  - name: scamshield-national-db
    plan: 0.1c-256mb
    databaseName: scamshield
    user: scamshield
