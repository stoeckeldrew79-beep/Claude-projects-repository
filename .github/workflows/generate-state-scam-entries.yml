name: Generate ScamShield state scam entries

# Deepens per-state coverage, which the national job does not: its prompt
# tells it to set a state only when a scam is genuinely tied to one, so most
# of what it writes is nationwide and the state map stops growing.
#
# This is the same job with SCAMSHIELD_TARGET=state, not a second generator —
# the corpus guards (slug collisions, verbatim source URLs, category
# validation) live in one place and cannot drift apart.
#
# The target state is whichever currently has the fewest documented entries,
# derived from the corpus at run time rather than a stored rotation cursor:
# a missed or failed run costs nothing, and coverage self-levels.

on:
  schedule:
    # 07:10 and 19:10 UTC — an hour after the national run, so the two never
    # contend for the same push and each commit is attributable to one job.
    - cron: '10 7,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be added without writing anything'
        type: boolean
        default: false
      batch_size:
        description: 'Entries to attempt this run'
        default: '3'

concurrency:
  group: generate-scam-entries
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scamshield-national/backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scamshield-national/backend/package-lock.json

      - run: npm ci

      - name: Generate state entries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAMSHIELD_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
          SCAMSHIELD_TARGET: state
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run generate-scams
          else
            npm run generate-scams -- --apply
          fi

      # A generated entry that does not compile must never reach main.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new entries this run — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated state scam entries ($(date -u +%Y-%m-%d))"
          # main may have moved while the API call was in flight.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 3 attempts."
          exit 1
