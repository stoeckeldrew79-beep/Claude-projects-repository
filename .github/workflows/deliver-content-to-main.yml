name: Deliver ScamShield content to main

on:
  push:
    branches: [claude/scamshield-national-phase1]
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deliver-content-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scamshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check whether anything needs delivering
        id: check
        run: |
          git fetch origin claude/scamshield-national-phase1
          n=$(git rev-list --count HEAD..origin/claude/scamshield-national-phase1)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n commit(s) to deliver"

      - name: Verify the pending commits are seed-data only
        id: scope
        if: steps.check.outputs.count != '0'
        # This workflow merges claude/scamshield-national-phase1 straight to
        # main on every push and every 6 hours, with no PR gate in between —
        # a draft PR opened elsewhere does not stop it. That's the right
        # behavior for seed-data content, which is self-verified below by an
        # actual DB boot before it ships. It is NOT safe for real app code
        # (routes, components, migrations, workflow files), which needs a
        # human review a scheduled bot can't provide. So: only auto-deliver
        # when every file touched by the pending commits is seed data.
        # Anything else halts delivery here (not a failure — just a stop)
        # until it's merged to main through an actual reviewed PR instead.
        run: |
          touched=$(git diff --name-only HEAD..origin/claude/scamshield-national-phase1)
          echo "Files touched by pending commits:"
          echo "$touched"
          offenders=$(echo "$touched" | grep -v '^scamshield-national/backend/src/db/seed-data/' || true)
          if [ -n "$offenders" ]; then
            echo "seed_data_only=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Delivery halted — pending commits touch non-seed-data files, which need a reviewed PR into main instead of this automated pipeline:"
            echo "$offenders"
          else
            echo "seed_data_only=true" >> "$GITHUB_OUTPUT"
            echo "All pending files are seed data — proceeding with automated delivery."
          fi

      - name: Set up Node
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Register the seed-data merge driver
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        # .gitattributes marks the shard files merge=scamseed. Merge drivers
        # are per-clone config, so a fresh checkout has to register it before
        # the merge or git silently falls back to a plain text merge.
        # test:merge-driver round-trips every shard through the driver's
        # parser byte for byte; if the parser has drifted from the data, that
        # is caught here rather than by a corrupt merge.
        run: |
          npm --prefix scamshield-national run install-merge-driver
          npm --prefix scamshield-national run test:merge-driver

      - name: Merge content branch
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff origin/claude/scamshield-national-phase1 \
            -m "Deliver ${{ steps.check.outputs.count }} ScamShield content commit(s) to main"; then
            echo "::error::Merge failed. Unmerged paths:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Verify the merged tree
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        run: |
          fail=0
          check() { if eval "$2"; then echo "ok   $1"; else echo "FAIL $1"; fail=1; fi; }
          check "pipertown-studios/ populated" '[ -n "$(ls -A pipertown-studios 2>/dev/null)" ]'
          check "setup.js root install step"   'grep -q "install, root)" scamshield-national/scripts/setup.js'
          check "setup.js docker guard"        'grep -qi "docker" scamshield-national/scripts/setup.js'
          check "scamshield root lockfile"     '[ -f scamshield-national/package-lock.json ]'
          check "root CLAUDE.md"               '[ -f CLAUDE.md ]'
          check "root README.md"               '[ -f README.md ]'
          exit $fail

      - name: Backend boot smoke test (build, migrate, seed)
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        # Runs the exact sequence production runs on every boot
        # (package.json's "start" script), against a throwaway database,
        # before this content ever reaches main. This is the check that
        # would have caught both the dist/migrations copy bug and any
        # malformed seed-data entry the content bots or content routines
        # introduce, instead of that surfacing later as a silent
        # production gap only visible through symptoms like a frozen
        # state map or a reverted Admin edit.
        working-directory: scamshield-national/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scamshield
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
          node dist/db/migrate.js
          node dist/db/seed.js

      - name: Push to main
        if: steps.check.outputs.count != '0' && steps.scope.outputs.seed_data_only == 'true'
        run: git push origin HEAD:main
