name: Generate ScamShield scam entries

# Runs content generation on the Anthropic API's metered billing rather than
# a Claude subscription's weekly allowance, so the corpus keeps growing when
# no one is at a keyboard. Typechecks before it commits; pushes nothing if
# the run produced nothing.

on:
  schedule:
    # 06:10 and 18:10 UTC. Two small batches beat one large one — a bad run
    # costs half as much and is half as much to review.
    - cron: '10 6,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be added without writing anything'
        type: boolean
        default: false
      batch_size:
        description: 'Entries to attempt this run'
        default: '3'

concurrency:
  group: generate-scam-entries
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scamshield-national/backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scamshield-national/backend/package-lock.json

      - run: npm ci

      - name: Generate entries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAMSHIELD_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run generate-scams
          else
            npm run generate-scams -- --apply
          fi

      # A generated entry that does not compile must never reach main.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new entries this run — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated scam entries ($(date -u +%Y-%m-%d))"
          # main may have moved while the API call was in flight.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 3 attempts."
          exit 1
